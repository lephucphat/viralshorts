# Static dashboard server for the `prod` stage of dashboard/Dockerfile.
#
# This file is an nginx *template*: the official nginx image runs envsubst over
# /etc/nginx/templates/*.template at container start and writes the result to
# /etc/nginx/conf.d/. Only ${DOMAIN} and ${BACKEND_UPSTREAM} are substituted
# (see NGINX_ENVSUBST_FILTER in the Dockerfile); every other $variable below is
# a normal nginx variable.
#
#   DOMAIN            public host name, e.g. app.example.com (no scheme)
#   BACKEND_UPSTREAM  host:port of the API for /gallery and /video/
#                     (default backend:8000, the compose service name)
#
# In docker-compose.prod.yml, Caddy routes /api, /videos, /thumbnails, /gallery
# and /video straight to the backend and only the rest reaches this server.
# The /gallery and /video/ blocks below are a fallback for when nginx is
# exposed directly (e.g. the Coolify-style single-container deploy).
#
# Apex -> www redirects are NOT done here any more: they live in the reverse
# proxy (see the commented www block in the Caddyfile).

server {
    # Explicitly the default server for any Host header.
    listen 80 default_server;
    server_name ${DOMAIN} _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so the upstream name is resolved per request
    # instead of at startup (nginx refuses to start if "backend" is not up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cache hashed assets aggressively; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The public gallery and per-video pages are server-rendered by the backend.
    location /gallery {
        set $backend_upstream ${BACKEND_UPSTREAM};
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /video/ {
        set $backend_upstream ${BACKEND_UPSTREAM};
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # index.html must NOT be cached - it points at the hashed asset bundle, so a
    # stale cached copy keeps loading the previous deploy's JS. (nginx add_header
    # doesn't inherit into a location that sets its own, so the security headers
    # are repeated here.)
    #
    # $uri.html comes before $uri/ so the build-time SEO pages are served at their
    # clean path with a 200. Resolving them as directories instead would make
    # nginx 301 to a trailing-slash URL, so every canonical would point at a
    # redirect.
    #
    # Unknown paths get a real 404, not the SPA shell. The app routes entirely
    # through the hash (#/pricing, #/auth/callback), which never reaches the
    # server, so there is no deep link that needs the fallback.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
